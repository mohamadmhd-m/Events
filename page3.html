<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل القعاليات | دليل فعاليات الجامعة الافتراضية السورية</title>
    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #fef9f0;
            color: #2d2a2e;
        }
        
        :root {
            --orange: #ff7b2c;
            --purple: #9b4dff;
            --dark: #2d2a2e;
        }
        
        .navbar {
            background-color: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 12px 0;
        }
        
        .navbar-brand {
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--orange) !important;
        }
        
        .nav-link {
            font-weight: 500;
            color: #3a2c2f !important;
            margin: 0 5px;
            transition: 0.2s;
        }
        
        .nav-link:hover {
            color: var(--orange) !important;
            border-bottom: 2px solid var(--orange);
        }
        
        .detail-card {
            background: white;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            margin-bottom: 35px;
        }
        
        .detail-main-img {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
        }
        
        .detail-content {
            padding: 30px;
        }
        
        .event-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 15px;
        }
        
        .event-info-item {
            display: inline-flex;
            align-items: center;
            background: #f5f0ea;
            padding: 8px 18px;
            border-radius: 50px;
            margin-left: 12px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        
        .event-info-item i {
            color: var(--orange);
            margin-left: 8px;
        }
        
        .badge-cat {
            background-color: var(--orange);
            color: white;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            display: inline-block;
        }
        

        .gallery-item {
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            height: 100px;
            object-fit: cover;
            width: 100%;
        }
        
        .gallery-item:hover {
            opacity: 0.8;
            transform: scale(1.02);
        }
        

        .static-map {
            border-radius: 24px;
            width: 100%;
            height: 250px;
            object-fit: cover;
            border: 1px solid #eee;
        }
        
     
        .share-btn, .calendar-btn {
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        
        .calendar-btn {
            background-color: var(--orange);
            color: white;
            border: none;
        }
        
        .calendar-btn:hover {
            background-color: #e55a0e;
            color: white;
        }
        
        .share-btn {
            background-color: #eee6dd;
            color: #4a3a2a;
            border: none;
        }
        
        .share-btn:hover {
            background-color: #ddd0c0;
            color: #2d2a2e;
        }
        
        .related-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: 0.2s;
            height: 100%;
        }
        
        .related-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 22px rgba(0,0,0,0.1);
        }
        
        .related-card img {
            height: 140px;
            object-fit: cover;
            width: 100%;
        }
        
        .related-card .card-body {
            padding: 15px;
        }
        
        .related-card .card-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .related-link {
            text-decoration: none;
            color: inherit;
        }
        
        footer {
            background-color: #1e1b1c;
            color: #ddd7ce;
            border-radius: 40px 40px 0 0;
            margin-top: 60px;
            padding: 35px;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .detail-content {
                padding: 20px;
            }
            .event-title {
                font-size: 1.5rem;
            }
            .event-info-item {
                padding: 5px 12px;
                font-size: 0.8rem;
            }
        }
        
        .error-message {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 32px;
        }
        
        .toast-msg {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 9999;
            background-color: var(--orange);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 500;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: none;
        }
    </style>
</head>
<body>


<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <i class="fas fa-calendar-alt"></i> فعاليات الجامعة الافتراضية السورية
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">الرئيسية</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="page2.html">كل الفعاليات</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="page3.html">تفاصيل الفعالية</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="page4.html">عن الدليل</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="page5.html">اتصل بنا</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4" id="mainContent">
    <div class="text-center py-5">
        <div class="spinner-border text-warning" role="status"></div>
        <p>جاري تحميل تفاصيل الفعالية...</p>
    </div>
</main>

<div id="toastMsg" class="toast-msg">
    <i class="fas fa-check-circle"></i> <span id="toastText"></span>
</div>

<footer>
    <p>© 2026 دليل الفعاليات | جميع الحقوق محفوظة</p>
    <p class="small">اكتشف أفضل الفعاليات في مكان واحد</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<script>
    var allEventsData = [
        { 
            id: 1, 
            name: "قمة التقنيات الحديثة", 
            category: "conference", 
            date: "2026-04-28", 
            location: "مدينة المعارض - طريق المطار", 
            fullDescription: "قمة التقنيات الحديثة هي أكبر حدث تقني في المنطقة. يشارك فيها نخبة من الخبراء في مجال الذكاء الاصطناعي، البلوكتشين، والواقع الافتراضي. ستحظى بفرصة حضور ورش عمل تفاعلية، وجلسات نقاش حية، ومعرض للابتكارات. لا تفوت هذه الفرصة للتواصل مع كبرى الشركات التقنية واكتشاف مستقبل التكنولوجيا.",
            image: "img/Foldertech/1.png",
            gallery: [
                "img/Foldertech/2.png",
                "img/Foldertech/3.png",
                "img/Foldertech/4.png"
            ],
            mapImage: "img/Foldertech/5.JFIF"
        },
        { 
            id: 2, 
            name: "معرض الفن المعاصر", 
            category: "exhibition", 
            date: "2026-05-05", 
            location: "مركز الثقافي", 
            fullDescription: "معرض الفن المعاصر يجمع أعمالاً لفنانين محليين وعالميين في مكان واحد. ستشاهد لوحات فنية، منحوتات، وتركيبات فنية مبتكرة. يهدف المعرض إلى دعم الفنانين الشباب وتعريف الجمهور بأحدث اتجاهات الفن المعاصر.",
            image: "img/Folderart/1.png",
            gallery: [
                "img/Folderart/2.png",
                "img/Folderart/3.png",
                "img/Folderart/4.png"
            ],
            mapImage: "img/Folderart/5.jpg"
        },
        { 
            id: 3, 
            name: "ماراثون المدينة الرياضي", 
            category: "sports", 
            date: "2026-05-27", 
            location: "اوتستراد المزة", 
            fullDescription: "ماراثون الرياضة يحفزك على المشاركة في سباق 10 كيلو متر و 5 كيلو متر للأطفال. جوائز قيمة للفائزين، وأجواء مليئة بالحماسة والنشاط. الدعوة عامة للجميع للاستمتاع بيوم رياضي مميز مع العائلة.",
            image: "img/Foldersport/1.png",
            gallery: [
                "img/Foldersport/2.png",
                "img/Foldersport/3.png",
                "img/Foldersport/4.png"
            ],
            mapImage: "img/Foldersport/5.JPEG"
        },
        { 
            id: 4, 
            name: "ورشة تطوير مهارات", 
            category: "workshop", 
            date: "2026-05-10", 
            location: "الجامعة الافتراضية السورية", 
            fullDescription: "مؤتمر ريادة الأعمال يقدم ورش عمل ونقاشات عن تأسيس الشركات الناشئة وجذب الاستثمارات. بحضور مستثمرين وأصحاب خبرة في عالم ريادة الأعمال. فرصة ممتازة للتعلم والتواصل.",
            image: "img/Folderworkshop/1.png",
            gallery: [
                "img/Folderworkshop/2.png",
                "img/Folderworkshop/3.png",
                "img/Folderworkshop/4.png"
            ],
            mapImage: "img/Folderworkshop/5.jpg"
        },
        { 
            id: 5, 
            name: "امسية غنائية على ضوء القمر", 
            category: "music", 
            date: "2026-05-30", 
            location: "شاطئ البحر", 
            fullDescription: "أمسية جاز هادئة على شاطئ الخبر. احضر واستمتع بالموسيقى الهادئة، مع إطلالة رومانسية على البحر. مناسب للعائلات والأزواج. يبدأ البرنامج عند غروب الشمس.",
            image: "img/Foldermusic/1.png",
            gallery: [
                "img/Foldermusic/2.png",
                "img/Foldermusic/3.png",
                "img/Foldermusic/4.png  "
            ],
            mapImage: "img/Foldermusic/5.JFIF"
        },
    ];
    

    function getCategoryArabic(cat) {
        if(cat === "conference") return "مؤتمر";
        if(cat === "music") return "موسيقى";
        if(cat === "exhibition") return "معرض";
        if(cat === "sports") return "رياضة";
        if(cat === "workshop") return "ورشة عمل";
        return cat;
    }
    

    function formatDate(dateStr) {
        var parts = dateStr.split("-");
        if(parts.length === 3) {
            var day = parseInt(parts[2], 10);
            var month = parseInt(parts[1], 10);
            var year = parseInt(parts[0], 10);
            var monthNames = ["يناير", "فبراير", "مارس", "إبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
            return day + " " + monthNames[month-1] + " " + year;
        }
        return dateStr;
    }
    
  
    function getRelatedEvents(currentEvent, allEvents) {
        var related = [];
        for(var i = 0; i < allEvents.length; i++) {
            var ev = allEvents[i];
            if(ev.id === currentEvent.id) continue;
            if(ev.category === currentEvent.category) {
                related.push(ev);
            }
            if(related.length >= 3) break;
        }

        if(related.length < 3) {
            for(var j = 0; j < allEvents.length; j++) {
                var ev2 = allEvents[j];
                if(ev2.id === currentEvent.id) continue;
                var alreadyExists = false;
                for(var k = 0; k < related.length; k++) {
                    if(related[k].id === ev2.id) alreadyExists = true;
                }
                if(!alreadyExists && related.length < 3) {
                    related.push(ev2);
                }
            }
        }
        return related;
    }
    
    function buildGallery(images) {
        var html = '<div class="row g-2 mt-3">';
        for(var i = 0; i < images.length; i++) {
            html += '<div class="col-4">';
            html += '<img src="' + images[i] + '" class="gallery-item" alt="gallery image">';
            html += '</div>';
        }
        html += '</div>';
        return html;
    }
    

    function buildRelatedEvents(relatedEvents) {
        if(relatedEvents.length === 0) {
            return '<p class="text-muted">لا توجد فعاليات ذات صلة</p>';
        }
        var html = '<div class="row g-3">';
        for(var i = 0; i < relatedEvents.length; i++) {
            var ev = relatedEvents[i];
            var catAr = getCategoryArabic(ev.category);
            html += `
                <div class="col-md-4">
                    <div class="related-card">
                        <a href="page3.html?id=${ev.id}" class="related-link">
                            <img src="${ev.image}" alt="${ev.name}">
                            <div class="card-body">
                                <span class="badge-cat" style="font-size:0.7rem; padding:3px 10px;">${catAr}</span>
                                <h6 class="card-title mt-2">${ev.name}</h6>
                                <p class="small text-muted mb-0"><i class="far fa-calendar-alt"></i> ${formatDate(ev.date)}</p>
                            </div>
                        </a>
                    </div>
                </div>
            `;
        }
        html += '</div>';
        return html;
    }
    

    function showToast(message) {
        var toastDiv = document.getElementById("toastMsg");
        var toastText = document.getElementById("toastText");
        toastText.innerHTML = message;
        toastDiv.style.display = "block";
        setTimeout(function() {
            toastDiv.style.display = "none";
        }, 2000);
    }
    
  
    function loadEventDetails() {
       
        var urlParams = new URLSearchParams(window.location.search);
        var eventId = urlParams.get("id");
        
        if(!eventId) {
  
            eventId = "1";
        }
        
        var eventIdNum = parseInt(eventId, 10);
        var currentEvent = null;
        
        for(var i = 0; i < allEventsData.length; i++) {
            if(allEventsData[i].id === eventIdNum) {
                currentEvent = allEventsData[i];
                break;
            }
        }
        
        var mainDiv = document.getElementById("mainContent");
        
        if(!currentEvent) {
            mainDiv.innerHTML = `
                <div class="error-message">
                    <i class="fas fa-exclamation-triangle fa-3x" style="color:#ff7b2c;"></i>
                    <h3 class="mt-3">عفواً، الفعالية غير موجودة</h3>
                    <p>لم نتمكن من العثور على الفعالية المطلوبة</p>
                    <a href="page2.html" class="btn btn-custom mt-3" style="background:#ff7b2c; color:white; padding:8px 25px; border-radius:40px; text-decoration:none;">العودة لجميع الفعاليات</a>
                </div>
            `;
            return;
        }
        
        var categoryAr = getCategoryArabic(currentEvent.category);
        var formattedDate = formatDate(currentEvent.date);
        var galleryHtml = buildGallery(currentEvent.gallery);
        var relatedEvents = getRelatedEvents(currentEvent, allEventsData);
        var relatedHtml = buildRelatedEvents(relatedEvents);
        
        var fullHtml = `
            <div class="detail-card">
                <img src="${currentEvent.image}" class="detail-main-img" alt="${currentEvent.name}">
                <div class="detail-content">
                    <span class="badge-cat">${categoryAr}</span>
                    <h1 class="event-title mt-2">${currentEvent.name}</h1>
                    
                    <div class="d-flex flex-wrap align-items-center mb-3">
                        <div class="event-info-item">
                            <i class="fas fa-calendar-alt"></i> ${formattedDate}
                        </div>
                        <div class="event-info-item">
                            <i class="fas fa-map-marker-alt"></i> ${currentEvent.location}
                        </div>
                    </div>
                    
                    <div class="row mt-4">
                        <div class="col-lg-8">
                            <h5><i class="fas fa-info-circle"></i> عن الفعالية</h5>
                            <p class="text-muted lh-base">${currentEvent.fullDescription}</p>
                            
                            <h5 class="mt-3"><i class="fas fa-images"></i> معرض الصور</h5>
                            ${galleryHtml}
                        </div>
                        <div class="col-lg-4">
                            <div class="bg-light p-3 rounded-4">
                                <h5><i class="fas fa-map-marked-alt"></i> الموقع على الخريطة</h5>
                                <img src="${currentEvent.mapImage}" class="static-map" alt="خريطة الموقع">
                                <p class="small text-muted mt-2">📍 ${currentEvent.location}</p>
                                
                                <div class="d-flex gap-2 mt-3 flex-wrap">
                                    <button id="calendarBtn" class="calendar-btn"><i class="fas fa-calendar-plus"></i> أضف للتقويم</button>
                                    <button id="shareBtn" class="share-btn"><i class="fas fa-share-alt"></i> شارك</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-5">
                <h4><i class="fas fa-link"></i> فعاليات ذات صلة</h4>
                ${relatedHtml}
            </div>
        `;
        
        mainDiv.innerHTML = fullHtml;
        

        var calendarBtn = document.getElementById("calendarBtn");
        var shareBtn = document.getElementById("shareBtn");
        
        if(calendarBtn) {
            calendarBtn.addEventListener("click", function() {
   
                showToast("تمت إضافة الفعالية إلى تقويمك 📅");
            });
        }
        
        if(shareBtn) {
            shareBtn.addEventListener("click", function() {

                var url = window.location.href;
                if(navigator.share) {
                    navigator.share({
                        title: currentEvent.name,
                        text: "تعالوا معي لحضور هذه الفعالية الرائعة!",
                        url: url
                    }).catch(function() {});
                } else {

                    var tempInput = document.createElement("input");
                    tempInput.value = url;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand("copy");
                    document.body.removeChild(tempInput);
                    showToast("تم نسخ رابط الفعالية ✅");
                }
            });
        }
    }
    

    loadEventDetails();
</script>
</body>
</html>
